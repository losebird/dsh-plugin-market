# @ace-zone/dsh-market bundle patch：单行双面插件
# 同一包同时提供：
#   - host 半片（src/host.js，包主入口）：/plugin-market/* REST + 安装/卸载执行
#   - 浏览器半片（src/client.js，dsh.client 声明 + exports["./client"]）：设置内「插件市场」+ 卡片弹窗
# 用户安装：dsh plugin --profile web add @ace-zone/dsh-market

- insert:
    - id: plugin-market
      name: '@ace-zone/dsh-market'
