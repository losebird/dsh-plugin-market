# dsh-plugin-market bundle patch：单行双面插件
# 同一包同时提供：
#   - host 半片（src/host.js，包主入口）：/api/market/* REST + 安装/卸载执行
#   - 浏览器半片（src/client.js，dsh.client 声明 + exports["./client"]）：侧栏按钮 + 卡片弹窗
# 用户安装：dsh plugin --profile web add github:losebird/dsh-plugin-market#v0.1.0

- insert:
    - id: plugin-market
      name: 'dsh-plugin-market'
