name: merge-curated

on:
  push:
    branches: [main]
    paths:
      - 'registry/curated/**'
      - 'registry/index.json'
  workflow_dispatch:

concurrency:
  group: merge-curated
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge curated into all.json
        run: node scripts/merge-curated.mjs
      - name: Render README
        run: node scripts/render-readme.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/all.json README.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(registry): merge curated into all.json"
            git pull --rebase origin main
            git push
          fi
