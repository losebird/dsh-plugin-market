name: collect

on:
  schedule:
    - cron: '17 2 * * *' # 每日 UTC 02:17 自动采集
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'registry/blocklist.json'

concurrency:
  group: collect
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect.mjs
      - name: Render README
        run: node scripts/render-readme.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/auto.json registry/all.json README.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(registry): refresh auto-collected plugins"
            git pull --rebase origin main
            git push
          fi
      # GITHUB_TOKEN 的 push 不触发下游 push workflow。deploy-pages 通过
      # workflow_run 监听本任务成功，重新部署网站优先读取的 registry 静态副本。
