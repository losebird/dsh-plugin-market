name: validate

on:
  pull_request:
    paths:
      - 'registry/curated/**'
      - 'registry/blocklist.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate curated entries
        run: node scripts/validate.mjs
